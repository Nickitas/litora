# Самостоятельный пример для закрытого пилота, не override infra/compose.yaml.
# Сначала заполните /etc/litora/production.env по deployment.md.
name: litora-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: postgresql://litora_app:${POSTGRES_PASSWORD:?app password required}@postgres:5432/litora
  WEB_ORIGIN: https://${LITORA_DOMAIN:?domain required}
  API_ORIGIN: https://${LITORA_DOMAIN:?domain required}
  COOKIE_SECURE: "true"
  S3_ENDPOINT: ${S3_ENDPOINT:?S3 endpoint required}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?public S3 endpoint required}
  S3_REGION: ${S3_REGION:?region required}
  S3_BUCKET: ${S3_BUCKET:?bucket required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?access key required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?secret key required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_AUTO_CREATE_BUCKET: "false"
  LITO_CLI_BINARY: /usr/local/bin/lito
  JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-300000}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?pinned postgres 17 image required}
    environment:
      POSTGRES_USER: litora_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?admin password required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litora_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 2g
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:?release API image required}
    environment: *app-environment
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped
    logging: *logging

  worker:
    image: ${API_IMAGE:?release API image required}
    command: ["node", "dist/worker/main.js"]
    environment: *app-environment
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 2g
    cpus: 2
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  web:
    image: ${WEB_IMAGE:?release web image required}
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:?pinned caddy image required}
    environment:
      LITORA_DOMAIN: ${LITORA_DOMAIN:?domain required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME email required}
      LITORA_ALLOWED_CIDRS: ${LITORA_ALLOWED_CIDRS:?pilot allowlist required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_started }
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
