services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litora}
      POSTGRES_USER: ${POSTGRES_USER:-litora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litora_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - litora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litora} -d ${POSTGRES_DB:-litora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-litora}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-litora_local_password}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - litora_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-litora_local_password}
    volumes:
      - ./postgres/init:/migrations:ro
    command:
      - psql
      - --set=ON_ERROR_STOP=1
      - --host=postgres
      - --username=${POSTGRES_USER:-litora}
      - --dbname=${POSTGRES_DB:-litora}
      - --file=/migrations/001_schema.sql
    restart: "no"

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/lito-api/Dockerfile
    env_file: ../.env.local
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-litora}:${POSTGRES_PASSWORD:-litora_local_password}@postgres:5432/${POSTGRES_DB:-litora}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      LITO_CLI_BINARY: /usr/local/bin/lito
      PORT: 3000
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    depends_on:
      postgres-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/lito-api/Dockerfile
    env_file: ../.env.local
    environment: *app-environment
    command: ["node", "dist/worker/main.js"]
    depends_on:
      api: { condition: service_healthy }
    init: true
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/lito-web/Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  litora_postgres_data:
  litora_minio_data:
