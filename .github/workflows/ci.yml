name: Проверка Litora

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.4
          cache-dependency-path: apps/lito-cli/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:init
      - run: pnpm verify

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/setup.mjs
      - run: docker compose --env-file .env.local -f infra/compose.yaml --profile app up -d --build --wait
      - run: node scripts/integration-test.mjs
      - if: failure()
        run: docker compose --env-file .env.local -f infra/compose.yaml --profile app logs --tail=100
      - if: always()
        run: docker compose --env-file .env.local -f infra/compose.yaml --profile app down
