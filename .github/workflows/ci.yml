name: Проверка Litora

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://litora_test:litora_test_password@localhost:5432/litora_test_invitations
    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: litora_test
          POSTGRES_PASSWORD: litora_test_password
          POSTGRES_DB: litora_test_invitations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U litora_test -d litora_test_invitations"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.4
          cache-dependency-path: apps/lito-cli/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:init
      - run: pnpm verify
      - run: pnpm --filter litora-web exec playwright install --with-deps chromium
      - run: pnpm test:web:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure
          path: apps/lito-web/test-results/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter litora-web... --filter litora-api...
      - run: pnpm --filter litora-web exec playwright install --with-deps chromium
      - run: node scripts/setup.mjs
      - run: docker compose --env-file .env.local -f infra/compose.yaml --profile app up -d --build --wait
      - name: Проверка HTTP с одноразовыми тестовыми приглашениями
        run: |
          TEST_INVITATIONS_JSON="$(docker compose --env-file .env.local -f infra/compose.yaml exec -T api node dist/scripts/invitations.js create --count 3 --expires-hours 1)"
          export TEST_INVITATIONS_JSON
          node scripts/integration-test.mjs
      - name: Подменённый набор в S3 не исполняется
        run: |
          docker compose --env-file .env.local -f infra/compose.yaml exec -T api node dist/scripts/invitations.js create --count 1 --expires-hours 1 |
            TEST_S3_CORRUPTION=1 TEST_API_URL=http://localhost:3000/api node --env-file=.env.local apps/lito-api/scripts/integration-corrupted-dataset.mjs
      - name: Реальный кабинет через API, worker и S3
        run: |
          LITORA_E2E_INVITATION="$(docker compose --env-file .env.local -f infra/compose.yaml exec -T api node dist/scripts/invitations.js create --count 1 --expires-hours 1 | node -e 'let s=""; process.stdin.on("data", x => s += x); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).invitations[0].code))')"
          export LITORA_E2E_INVITATION
          LITORA_E2E_LIVE_URL=http://localhost:5173 pnpm --filter litora-web exec playwright test e2e/live-workflow.spec.ts --grep @live
      - if: failure()
        run: docker compose --env-file .env.local -f infra/compose.yaml --profile app logs --tail=100
      - if: always()
        run: docker compose --env-file .env.local -f infra/compose.yaml --profile app down
